<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FB Ads Library Dashboard</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <i class="ti ti-brand-facebook"></i>
      <span>Ads Library</span>
    </div>
    <nav class="sidebar-nav">
      <a href="#" class="nav-item active"><i class="ti ti-layout-dashboard"></i> Dashboard</a>
      <a href="#" class="nav-item"><i class="ti ti-search"></i> Search Ads</a>
      <a href="#" class="nav-item"><i class="ti ti-chart-bar"></i> Analytics</a>
      <a href="#" class="nav-item"><i class="ti ti-download"></i> Exports</a>
    </nav>
    <div class="sidebar-footer">
      <div class="token-section">
        <label><i class="ti ti-lock"></i> Access Token</label>
        <input type="password" id="tokenInput" placeholder="Paste token..." />
        <button id="saveTokenBtn" onclick="saveToken()"><i class="ti ti-check"></i> Save</button>
      </div>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="main">

    <!-- TOP BAR -->
    <header class="topbar">
      <div class="topbar-left">
        <h1>Dashboard</h1>
        <span class="breadcrumb">Ads Library Explorer</span>
      </div>
      <div class="topbar-right">
        <span id="lastUpdated" class="last-updated"></span>
        <button class="btn btn-ghost" onclick="fetchAds()"><i class="ti ti-refresh"></i> Refresh</button>
        <button class="btn btn-primary" onclick="exportCSV()"><i class="ti ti-download"></i> Export CSV</button>
      </div>
    </header>

    <!-- SEARCH BAR -->
    <section class="search-section">
      <div class="search-grid">
        <div class="search-field wide">
          <label>Keyword</label>
          <div class="input-icon">
            <i class="ti ti-search"></i>
            <input type="text" id="searchInput" placeholder="e.g. ក្លោងក្លោក, sale, promotion..." value="ក្លោងក្លោក" />
          </div>
        </div>
        <div class="search-field">
          <label>Country</label>
          <select id="countrySelect">
            <option value="ALL">All countries</option>
            <option value="KH" selected>Cambodia (KH)</option>
            <option value="US">USA</option>
            <option value="TH">Thailand</option>
            <option value="VN">Vietnam</option>
            <option value="SG">Singapore</option>
            <option value="PH">Philippines</option>
            <option value="ID">Indonesia</option>
            <option value="MY">Malaysia</option>
            <option value="GB">UK</option>
            <option value="AU">Australia</option>
          </select>
        </div>
        <div class="search-field">
          <label>Status</label>
          <select id="statusSelect">
            <option value="ACTIVE">Active only</option>
            <option value="ALL">All statuses</option>
            <option value="INACTIVE">Inactive</option>
          </select>
        </div>
        <div class="search-field">
          <label>Media type</label>
          <select id="mediaSelect">
            <option value="all">All media</option>
            <option value="image">Image</option>
            <option value="video">Video</option>
            <option value="no_image_or_video">No media</option>
          </select>
        </div>
        <div class="search-field">
          <label>Results per page</label>
          <select id="limitSelect">
            <option value="10">10</option>
            <option value="25" selected>25</option>
            <option value="50">50</option>
          </select>
        </div>
        <div class="search-field btn-field">
          <button class="btn btn-primary large" onclick="fetchAds()">
            <i class="ti ti-search"></i> Search Ads
          </button>
        </div>
      </div>
    </section>

    <!-- ERROR BOX -->
    <div id="errorBox" class="error-box" style="display:none;"></div>

    <!-- METRIC CARDS -->
    <section class="metrics-section">
      <div class="metric-card">
        <div class="metric-icon blue"><i class="ti ti-ad"></i></div>
        <div class="metric-body">
          <div class="metric-label">Total ads</div>
          <div class="metric-value" id="metTotal">—</div>
        </div>
      </div>
      <div class="metric-card">
        <div class="metric-icon green"><i class="ti ti-circle-check"></i></div>
        <div class="metric-body">
          <div class="metric-label">Active ads</div>
          <div class="metric-value" id="metActive">—</div>
        </div>
      </div>
      <div class="metric-card">
        <div class="metric-icon purple"><i class="ti ti-building-store"></i></div>
        <div class="metric-body">
          <div class="metric-label">Advertisers</div>
          <div class="metric-value" id="metPages">—</div>
        </div>
      </div>
      <div class="metric-card">
        <div class="metric-icon amber"><i class="ti ti-device-mobile"></i></div>
        <div class="metric-body">
          <div class="metric-label">Platforms</div>
          <div class="metric-value" id="metPlatforms">—</div>
        </div>
      </div>
    </section>

    <!-- RESULTS HEADER -->
    <div class="results-header">
      <span id="resultsCount" class="results-count"></span>
      <div class="results-controls">
        <label>Sort by</label>
        <select id="sortSelect" onchange="sortAndRender()">
          <option value="date_desc">Newest first</option>
          <option value="date_asc">Oldest first</option>
          <option value="page_asc">Page name A–Z</option>
        </select>
      </div>
    </div>

    <!-- ADS LIST -->
    <section id="adsContainer" class="ads-container">
      <div class="empty-state">
        <i class="ti ti-ad-off"></i>
        <p>Enter a keyword and click Search to explore ads</p>
      </div>
    </section>

    <!-- PAGINATION -->
    <div class="pagination" id="paginationRow" style="display:none;">
      <button id="prevBtn" class="btn btn-ghost" onclick="changePage(-1)" disabled>
        <i class="ti ti-arrow-left"></i> Previous
      </button>
      <span id="pageInfo" class="page-info"></span>
      <button id="nextBtn" class="btn btn-ghost" onclick="changePage(1)">
        Next <i class="ti ti-arrow-right"></i>
      </button>
    </div>

  </main>

  <script src="app.js"></script>
</body>
</html>
